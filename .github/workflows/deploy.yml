name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 二十五套测试全部通过才允许部署（reader 1750 ＋ worker 988 ＝ 2738 条）。都是纯逻辑测试，不依赖浏览器 / 网络 / 线上环境。
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # reader 的测试会 import src/*（间接依赖 vue），所以必须先装依赖
      - name: Install dependencies
        run: npm ci
        working-directory: reader

      - name: Reader tests (verify-core / verify-vueimports / verify-sync / verify-booksync / verify-import / verify-books / verify-importui / smoke / verify-authui / verify-audio / verify-genui / verify-generate / verify-hotswitch / verify-feedbackui / verify-sw)
        run: npm test
        working-directory: reader

      # worker 的九套测试只用 node 内置模块（node:sqlite 等），零依赖，不必 npm ci
      - name: Worker tests (verify-worker / verify-auth / verify-authapi / verify-sql / verify-audioalias / verify-booksync / verify-bookaudio / verify-audiogen)
        run: npm test
        working-directory: worker

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci
        working-directory: reader

      - name: Build
        run: npm run build
        working-directory: reader

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reader/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署后清 Cloudflare 缓存，避免旧 index.html 引用已删除的 hash chunk
      # 需要仓库 secrets: CF_ZONE_ID + CF_API_TOKEN（权限 Zone.Cache Purge）
      # 这一格**只报告、不拦部署**（continue-on-error）：没配 secret、或清了但没成功，都要**看得见**
      # —— 未配 secret 打 warning、响应体整段打出来、`success` 不是 true 也打 warning。
      - name: Purge Cloudflare Cache
        if: success()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.CF_ZONE_ID }}" ] || [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "::warning::CF secrets not configured (CF_ZONE_ID / CF_API_TOKEN) — cache purge SKIPPED"
            exit 0
          fi
          body="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "purge response: $body"
          case "$body" in
            *'"success":true'*) echo "cache purged" ;;
            *) echo "::warning::cache purge did not report success: $body" ;;
          esac
