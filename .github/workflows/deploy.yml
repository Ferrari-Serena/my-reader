name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # reader／worker 的 npm test 全部通过才允许部署。测试集合以各自 package.json 为准，
  # 不在本文件维护套数或条数，避免数字漂移。都是纯逻辑测试，不依赖浏览器 / 网络 / 线上环境。
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # reader 的测试会 import src/*（间接依赖 vue），所以必须先装依赖
      - name: Install dependencies
        run: npm ci
        working-directory: reader
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Reader tests (npm test — all verify-* / smoke suites)
        run: npm test
        working-directory: reader

      # worker 的测试只用 node 内置模块（node:sqlite 等），零依赖，不必 npm ci
      - name: Worker tests (npm test — all verify-* suites)
        run: npm test
        working-directory: worker

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci
        working-directory: reader
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      # 3.1b 修复项 ①：构建前的版本握手。前端期望的 Worker 版本 = worker/src/version.js，
      # Worker /version 载荷也是它；缺失/格式错/mismatch 一律红。登记表字段也在这里自检。
      - name: Version handshake (frontend ↔ worker)
        working-directory: reader
        run: |
          node --input-type=module - <<'EOF'
          import { resolveBuildId, assertVersionConsistency, SOURCE_ALLOW } from './vite.config.js'
          import { versionPayload, WORKER_VERSION } from '../worker/src/version.js'
          const buildId = resolveBuildId()
          assertVersionConsistency({ buildId, workerVersion: WORKER_VERSION, workerPayload: versionPayload() })
          for (const e of SOURCE_ALLOW) {
            for (const k of ['id', 'slot', 'consumer', 'registrant', 'reason']) {
              if (typeof e[k] !== 'string' || !e[k].trim()) throw new Error('SOURCE_ALLOW 缺字段 ' + k + ' @ ' + e.id)
            }
          }
          console.log('version handshake ok:', JSON.stringify({ buildId, workerVersion: WORKER_VERSION }))
          EOF

      - name: Build
        run: npm run build
        working-directory: reader

      # 3.1b 修复项 ②：成品期扫描。构建插件已扫过一遍；CI 再对 dist 做一次独立核验，
      # 确保 sw.js 带的是本次 BUILD_ID + Worker 版本，且产物里没有未登记的版本形串。
      - name: Artifact version scan (dist)
        working-directory: reader
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync, readdirSync, statSync } from 'node:fs'
          import { basename, join } from 'node:path'
          import { resolveBuildId, scanVersionStrings, allowedValues } from './vite.config.js'
          import { WORKER_VERSION } from '../worker/src/version.js'
          const buildId = resolveBuildId()
          const walk = (d) => readdirSync(d).flatMap((n) => {
            const p = join(d, n)
            return statSync(p).isDirectory() ? walk(p) : [p]
          })
          const files = walk('dist')
            .filter((p) => /\.(js|html|css)$/.test(p))
            .map((p) => ({ path: p, text: readFileSync(p, 'utf8') }))
          const sw = files.find((f) => basename(f.path) === 'sw.js')
          if (!sw) throw new Error('dist/sw.js 不存在')
          if (!sw.text.includes('const BUILD = ' + JSON.stringify(buildId).replace(/"/g, "'"))) throw new Error('dist/sw.js 缺本次 BUILD_ID')
          if (!sw.text.includes('const WORKER_VERSION = ' + JSON.stringify(WORKER_VERSION).replace(/"/g, "'"))) throw new Error('dist/sw.js 缺 WORKER_VERSION')
          const bad = scanVersionStrings(files.filter((f) => f !== sw), allowedValues(buildId))
          if (bad.length) throw new Error('成品期未登记版本形串：' + JSON.stringify(bad))
          console.log('artifact version scan ok:', JSON.stringify({ buildId, workerVersion: WORKER_VERSION, scanned: files.length }))
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reader/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署后清 Cloudflare 缓存，避免旧 index.html 引用已删除的 hash chunk
      # 需要仓库 secrets: CF_ZONE_ID + CF_API_TOKEN（权限 Zone.Cache Purge）
      # 这一格**只报告、不拦部署**（continue-on-error）：没配 secret、或清了但没成功，都要**看得见**
      # —— 未配 secret 打 warning、响应体整段打出来、`success` 不是 true 也打 warning。
      - name: Purge Cloudflare Cache
        if: success()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.CF_ZONE_ID }}" ] || [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "::warning::CF secrets not configured (CF_ZONE_ID / CF_API_TOKEN) — cache purge SKIPPED"
            exit 0
          fi
          body="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "purge response: $body"
          case "$body" in
            *'"success":true'*) echo "cache purged" ;;
            *) echo "::warning::cache purge did not report success: $body" ;;
          esac
